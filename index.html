<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Teachable Machine Pose Model</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <h1>Fruit Catcher (Pose Game)</h1>
    <div class="button-container">
      <button type="button" id="startBtn" onclick="init()">Start Game</button>
      <button type="button" id="stopBtn" onclick="stop()" disabled>Stop</button>
    </div>

    <div class="main-layout">
      <!-- Left: Webcam Section -->
      <div class="webcam-container">
        <h2>Webcam Feed</h2>
        <div class="canvas-wrapper">
          <canvas id="canvas"></canvas>
          <div id="max-prediction">Loading...</div>
        </div>
        <div id="label-container"></div>
      </div>

      <!-- Right: Game Section -->
      <div class="game-container">
        <h2>Game Screen</h2>
        <canvas id="game-canvas" width="400" height="600"></canvas>
      </div>
    </div>

    <!-- Teachable Machine 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>

    <!-- 애플리케이션 모듈 -->
    <script src="./js/stabilizer.js"></script>
    <script src="./js/poseEngine.js"></script>
    <script src="./js/gameEngine.js"></script>
    <script src="./js/main.js"></script>
  </body>
</html>
